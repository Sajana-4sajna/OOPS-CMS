<!DOCTYPE html>
<html>
<head>
    <title>Movie Details</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            background-color: lightgray;
            text-align: center;
        }

        img {
            width: 70px;
            height: 90px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h2>Movie Details</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Poster</th>
            <th>Year</th>
            <th>Genre</th>
            <th>Rating</th>
            <th>Director</th>
            <th>Country</th>
            <th>Language</th>
            <th>Actors</th>
        </tr>

        <tbody id="movieData">

            <tr>
                <td colspan="10">Loading...</td>
            </tr>

        </tbody>
    </table>
    <script>
        // Create XMLHttpRequest object

        var xhr = new XMLHttpRequest();

        // Open AJAX request
        xhr.open("GET", "movies.php", true);

        // When response is received
        xhr.onload = function() {

            if (xhr.status == 200) {

                // Convert JSON into JavaScript object

                var movies = JSON.parse(xhr.responseText);

                var output = "";

                // Display each movie
                movies.forEach(function(movie) {

                    output += "<tr>";

                    output += "<td>" + movie.id + "</td>";

                    output += "<td>" + movie.title + "</td>";

                    output += "<td>";
                    output += "<img src='" + movie.poster + "'>";
                    output += "</td>";

                    output += "<td>" + movie.year + "</td>";

                    output += "<td>" + movie.genre + "</td>";

                    output += "<td>" + movie.rating + "</td>";

                    output += "<td>" + movie.director + "</td>";

                    output += "<td>" + movie.country + "</td>";

                    output += "<td>" + movie.language + "</td>";

                    output += "<td>" + movie.actors + "</td>";

                    output += "</tr>";
                });
                // Put data inside table
                document.getElementById("movieData").innerHTML = output;

            }

            else {

                document.getElementById("movieData").innerHTML =
                    "<tr>" +
                    "<td colspan='10'>Failed to load data</td>" +
                    "</tr>";
            }
        };
        // If AJAX request fails
        xhr.onerror = function() {

            document.getElementById("movieData").innerHTML =
                "<tr>" +
                "<td colspan='10'>Error loading API</td>" +
                "</tr>";

        };
        // Send request
        xhr.send();
    </script>
</body>
</html>
